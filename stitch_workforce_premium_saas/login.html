<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCS EMS — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
  .login-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    z-index: 1;
    position: relative;
  }
  .login-card {
    width: 100%;
    max-width: 440px;
    padding: 40px;
    border-radius: var(--radius-lg);
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(var(--glass-blur));
    box-shadow: var(--glass-shadow);
    text-align: center;
  }
  .login-logo {
    width: 68px;
    height: 68px;
    border-radius: 14px;
    background-image: url('/assets/logo.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    border: 2px solid rgba(255, 255, 255, 0.4);
    overflow: hidden;
  }
  .login-logo i {
    display: none !important;
  }
  .login-card h2 {
    font-size: 24px;
    font-weight: 800;
    color: var(--teal-900);
    margin-bottom: 8px;
  }
  .login-card p {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 30px;
  }
  .form-group {
    text-align: left;
    margin-bottom: 20px;
    position: relative;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 8px;
  }
  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }
  .input-wrapper i {
    position: absolute;
    left: 14px;
    color: var(--text-muted);
    font-size: 15px;
  }
  .form-control {
    width: 100%;
    padding: 12px 14px 12px 42px !important;
    font-family: inherit;
    font-size: 14px;
    border-radius: var(--radius-sm);
    border: 1px solid rgba(255, 255, 255, 0.5);
    background: rgba(255, 255, 255, 0.25);
    color: var(--text-dark);
    outline: none;
    transition: all 0.2s ease;
  }
  .form-control:focus {
    background: rgba(255, 255, 255, 0.45);
    border-color: var(--teal-600);
    box-shadow: 0 0 10px rgba(22, 160, 133, 0.15);
  }
  .login-btn {
    width: 100%;
    padding: 14px;
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--teal-500), var(--teal-700));
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    box-shadow: 0 4px 15px rgba(15, 139, 115, 0.3);
    margin-top: 10px;
    transition: all 0.25s var(--ease-liquid);
  }
  .login-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(15, 139, 115, 0.45);
  }
  .login-btn:active {
    transform: translateY(0);
  }
  .forgot-link {
    display: inline-block;
    margin-top: 18px;
    font-size: 13px;
    font-weight: 700;
    color: var(--teal-600);
    transition: color 0.2s ease;
  }
  .forgot-link:hover {
    color: var(--teal-700);
  }
  .alert {
    padding: 12px;
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    font-weight: 600;
    margin-bottom: 20px;
    display: none;
    text-align: left;
  }
  .alert-danger {
    background: var(--red-bg);
    color: var(--red);
    border: 1px solid rgba(214, 79, 79, 0.2);
  }
  .alert-success {
    background: var(--teal-50);
    color: var(--teal-700);
    border: 1px solid rgba(15, 139, 115, 0.15);
  }
</style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-card glass">
    <div class="login-logo">
      <i class="fa-solid fa-cube"></i>
    </div>
    <h2>PCS Enterprise</h2>
    <p>Sign in to access the portal</p>
    
    <div id="error-alert" class="alert alert-danger"></div>
    <div id="success-alert" class="alert alert-success"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="email" class="form-control" placeholder="name@company.com" required autocomplete="email">
        </div>
      </div>
      
      <div class="form-group" style="margin-bottom: 25px;">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="login-btn">Sign In</button>
    </form>
    
    <a href="#" id="forgot-link" class="forgot-link">Forgot password?</a>

    <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid rgba(255, 255, 255, 0.3); display: flex; align-items: center; justify-content: center; gap: 8px;">
      <span style="font-size: 13.5px; color: var(--text-muted);">New Organization?</span>
      <button type="button" id="btn-open-register-modal" style="background: none; border: none; font-size: 13.5px; font-weight: 800; color: var(--teal-700); cursor: pointer; text-decoration: underline; padding: 0; font-family: inherit;">
        Register as Admin
      </button>
    </div>
  </div>
</div>

<!-- ================= REGISTER NEW COMPANY / ADMIN MODAL ================= -->
<div class="modal-overlay" id="register-company-modal" style="display:none; position:fixed; inset:0; background:rgba(15, 23, 42, 0.65); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); align-items:center; justify-content:center; z-index:9999; padding:20px; opacity:0; transition:opacity 0.2s ease;">
  <div class="modal-box" style="width:100%; max-width:540px; background:#ffffff; border:1px solid rgba(255,255,255,0.9); box-shadow:0 25px 60px rgba(0,0,0,0.3); border-radius:20px; display:flex; flex-direction:column; overflow:hidden; position:relative; text-align:left;">
    
    <!-- Modal Header -->
    <div style="padding:18px 24px; border-bottom:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center; background:#f8fafc;">
      <div>
        <h3 style="font-size:17.5px; font-weight:800; color:#0f172a; margin:0; display:flex; align-items:center; gap:8px;">
          <i class="fa-solid fa-building-circle-check" style="color:#0f766e;"></i> Create Company Account
        </h3>
        <p style="font-size:12px; color:#64748b; margin:4px 0 0;">Register your enterprise organization and setup master Admin access.</p>
      </div>
      <button type="button" id="register-modal-close" title="Close (Esc)" style="background:rgba(0,0,0,0.06); border:none; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#475569; font-size:16px; transition:all 0.15s;">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- Modal Form -->
    <form id="register-company-form" style="padding:24px; margin:0; display:flex; flex-direction:column; gap:16px; max-height:80vh; overflow-y:auto;">
      <div id="reg-error-alert" class="alert alert-danger" style="display:none; margin-bottom:0;"></div>
      <div id="reg-success-alert" class="alert alert-success" style="display:none; margin-bottom:0;"></div>

      <!-- Company Name & Code -->
      <div style="display:grid; grid-template-columns: 1.2fr 0.8fr; gap:12px;">
        <div class="form-group" style="margin-bottom:0;">
          <label style="display:block; font-size:12px; font-weight:700; color:#334155; margin-bottom:6px;">
            Company Name <span style="color:#ef4444;">*</span>
          </label>
          <div class="input-wrapper">
            <i class="fa-solid fa-building" style="left:12px; font-size:13.5px;"></i>
            <input type="text" id="reg-company-name" required placeholder="e.g. Tata Consultancy" style="width:100%; padding:10px 12px 10px 36px; border-radius:8px; border:1px solid #cbd5e1; background:#f8fafc; color:#0f172a; font-family:inherit; font-size:13.5px; outline:none; box-sizing:border-box;">
          </div>
        </div>

        <div class="form-group" style="margin-bottom:0;">
          <label style="display:block; font-size:12px; font-weight:700; color:#334155; margin-bottom:6px;">
            Company Code <span style="color:#ef4444;">*</span>
          </label>
          <input type="text" id="reg-company-code" required placeholder="tata" style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid #cbd5e1; background:#f8fafc; color:#0f172a; font-family:inherit; font-size:13.5px; outline:none; box-sizing:border-box;">
        </div>
      </div>

      <!-- Admin Full Name -->
      <div class="form-group" style="margin-bottom:0;">
        <label style="display:block; font-size:12px; font-weight:700; color:#334155; margin-bottom:6px;">
          Admin Full Name <span style="color:#ef4444;">*</span>
        </label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user-tie" style="left:12px; font-size:13.5px;"></i>
          <input type="text" id="reg-admin-name" required placeholder="e.g. Rajesh Sharma" style="width:100%; padding:10px 12px 10px 36px; border-radius:8px; border:1px solid #cbd5e1; background:#f8fafc; color:#0f172a; font-family:inherit; font-size:13.5px; outline:none; box-sizing:border-box;">
        </div>
      </div>

      <!-- Admin Work Email -->
      <div class="form-group" style="margin-bottom:0;">
        <label style="display:block; font-size:12px; font-weight:700; color:#334155; margin-bottom:6px;">
          Admin Work Email <span style="color:#ef4444;">*</span>
        </label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope" style="left:12px; font-size:13.5px;"></i>
          <input type="email" id="reg-admin-email" required placeholder="admin@company.com" style="width:100%; padding:10px 12px 10px 36px; border-radius:8px; border:1px solid #cbd5e1; background:#f8fafc; color:#0f172a; font-family:inherit; font-size:13.5px; outline:none; box-sizing:border-box;">
        </div>
      </div>

      <!-- Password & Confirm Password -->
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
        <div class="form-group" style="margin-bottom:0;">
          <label style="display:block; font-size:12px; font-weight:700; color:#334155; margin-bottom:6px;">
            Password <span style="color:#ef4444;">*</span>
          </label>
          <div style="position:relative; display:flex; align-items:center;">
            <input type="password" id="reg-password" required placeholder="Min 6 characters" style="width:100%; padding:10px 36px 10px 12px; border-radius:8px; border:1px solid #cbd5e1; background:#f8fafc; color:#0f172a; font-family:inherit; font-size:13.5px; outline:none; box-sizing:border-box;">
            <i class="fa-solid fa-eye" id="toggle-reg-pwd" style="position:absolute; right:12px; color:#64748b; cursor:pointer; font-size:13.5px;" title="Show/Hide"></i>
          </div>
        </div>

        <div class="form-group" style="margin-bottom:0;">
          <label style="display:block; font-size:12px; font-weight:700; color:#334155; margin-bottom:6px;">
            Confirm Password <span style="color:#ef4444;">*</span>
          </label>
          <div style="position:relative; display:flex; align-items:center;">
            <input type="password" id="reg-confirm-password" required placeholder="Re-type password" style="width:100%; padding:10px 36px 10px 12px; border-radius:8px; border:1px solid #cbd5e1; background:#f8fafc; color:#0f172a; font-family:inherit; font-size:13.5px; outline:none; box-sizing:border-box;">
            <i class="fa-solid fa-eye" id="toggle-reg-conf-pwd" style="position:absolute; right:12px; color:#64748b; cursor:pointer; font-size:13.5px;" title="Show/Hide"></i>
          </div>
        </div>
      </div>

      <button type="submit" id="btn-submit-company" class="login-btn" style="margin-top:12px; padding:12px; display:flex; align-items:center; justify-content:center; gap:8px;">
        <i class="fa-solid fa-rocket"></i> Register &amp; Launch Dashboard
      </button>
    </form>
  </div>
</div>

<script src="auth.js"></script>
</body>
</html>
