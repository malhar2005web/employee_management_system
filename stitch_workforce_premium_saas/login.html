<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCS EMS — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
  .login-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    z-index: 1;
    position: relative;
  }
  .login-card {
    width: 100%;
    max-width: 440px;
    padding: 40px;
    border-radius: var(--radius-lg);
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(var(--glass-blur));
    box-shadow: var(--glass-shadow);
    text-align: center;
  }
  .login-logo {
    width: 68px;
    height: 68px;
    border-radius: 14px;
    background-image: url('/assets/logo.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    border: 2px solid rgba(255, 255, 255, 0.4);
    overflow: hidden;
  }
  .login-logo i {
    display: none !important;
  }
  .login-card h2 {
    font-size: 24px;
    font-weight: 800;
    color: var(--teal-900);
    margin-bottom: 8px;
  }
  .login-card p {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 30px;
  }
  .form-group {
    text-align: left;
    margin-bottom: 20px;
    position: relative;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 8px;
  }
  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }
  .input-wrapper i {
    position: absolute;
    left: 14px;
    color: var(--text-muted);
    font-size: 15px;
  }
  .form-control {
    width: 100%;
    padding: 12px 14px 12px 42px !important;
    font-family: inherit;
    font-size: 14px;
    border-radius: var(--radius-sm);
    border: 1px solid rgba(255, 255, 255, 0.5);
    background: rgba(255, 255, 255, 0.25);
    color: var(--text-dark);
    outline: none;
    transition: all 0.2s ease;
  }
  .form-control:focus {
    background: rgba(255, 255, 255, 0.45);
    border-color: var(--teal-600);
    box-shadow: 0 0 10px rgba(22, 160, 133, 0.15);
  }
  .login-btn {
    width: 100%;
    padding: 14px;
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--teal-500), var(--teal-700));
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    box-shadow: 0 4px 15px rgba(15, 139, 115, 0.3);
    margin-top: 10px;
    transition: all 0.25s var(--ease-liquid);
  }
  .login-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(15, 139, 115, 0.45);
  }
  .login-btn:active {
    transform: translateY(0);
  }
  .forgot-link {
    display: inline-block;
    margin-top: 18px;
    font-size: 13px;
    font-weight: 700;
    color: var(--teal-600);
    transition: color 0.2s ease;
  }
  .forgot-link:hover {
    color: var(--teal-700);
  }
  .alert {
    padding: 12px;
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    font-weight: 600;
    margin-bottom: 20px;
    display: none;
    text-align: left;
  }
  .alert-danger {
    background: var(--red-bg);
    color: var(--red);
    border: 1px solid rgba(214, 79, 79, 0.2);
  }
  .alert-success {
    background: var(--teal-50);
    color: var(--teal-700);
    border: 1px solid rgba(15, 139, 115, 0.15);
  }

  /* ================= REGISTER COMPANY MODAL (RESPONSIVE & MODERN) ================= */
  .reg-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 16px;
    opacity: 0;
    transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    overflow-y: auto;
    box-sizing: border-box;
  }
  .reg-modal-card {
    width: 100%;
    max-width: 560px;
    max-height: min(92vh, 760px);
    background: #ffffff;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.95);
    box-shadow: 0 25px 65px -10px rgba(15, 23, 42, 0.35), 0 0 0 1px rgba(15, 23, 42, 0.06);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    text-align: left;
    transform: scale(0.96) translateY(12px);
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    box-sizing: border-box;
  }
  .reg-modal-overlay.active .reg-modal-card,
  .reg-modal-overlay[style*="opacity: 1"] .reg-modal-card {
    transform: scale(1) translateY(0);
  }

  .reg-modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
    flex-shrink: 0;
    box-sizing: border-box;
  }
  .reg-modal-header h3 {
    font-size: 18px;
    font-weight: 800;
    color: #0f172a;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 9px;
    letter-spacing: -0.2px;
  }
  .reg-modal-header p {
    font-size: 12.5px;
    color: #64748b;
    margin: 4px 0 0;
    line-height: 1.4;
  }
  .reg-modal-close-btn {
    background: #e2e8f0;
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #475569;
    font-size: 14px;
    transition: all 0.2s ease;
    flex-shrink: 0;
    margin-left: 12px;
  }
  .reg-modal-close-btn:hover {
    background: #cbd5e1;
    color: #0f172a;
    transform: scale(1.05);
  }

  .reg-modal-form {
    padding: 22px 24px 26px;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 15px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    box-sizing: border-box;
  }

  .reg-modal-form::-webkit-scrollbar {
    width: 6px;
  }
  .reg-modal-form::-webkit-scrollbar-track {
    background: transparent;
  }
  .reg-modal-form::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 3px;
  }
  .reg-modal-form::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }

  .reg-grid-row {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 14px;
    box-sizing: border-box;
  }
  .reg-grid-row-equal {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    box-sizing: border-box;
  }

  .reg-field-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 0;
  }
  .reg-field-group label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 700;
    color: #334155;
    margin: 0;
    letter-spacing: 0.1px;
  }
  .reg-field-group label .req {
    color: #ef4444;
    font-weight: 800;
    margin-left: 2px;
  }
  .reg-field-group label .helper-tag {
    font-size: 11px;
    font-weight: 600;
    color: #0f766e;
    background: rgba(15, 118, 110, 0.08);
    padding: 1px 6px;
    border-radius: 4px;
  }

  .reg-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
    box-sizing: border-box;
  }
  .reg-input-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    color: #94a3b8;
    pointer-events: none;
    transition: color 0.2s ease;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 16px;
  }
  .reg-input-wrap:focus-within .reg-input-icon {
    color: #0f766e;
  }

  .reg-input-control {
    width: 100% !important;
    height: 44px !important;
    padding: 11px 14px 11px 44px !important; /* Generous 44px ensures icons never overlap placeholder text */
    border-radius: 9px !important;
    border: 1.5px solid #cbd5e1 !important;
    background: #f8fafc !important;
    color: #0f172a !important;
    font-family: inherit !important;
    font-size: 13.5px !important;
    outline: none !important;
    box-sizing: border-box !important;
    transition: all 0.2s ease !important;
  }
  .reg-input-control::placeholder {
    color: #94a3b8 !important;
    opacity: 1 !important;
    font-weight: 400 !important;
  }
  .reg-input-control:focus {
    background: #ffffff !important;
    border-color: #0f766e !important;
    box-shadow: 0 0 0 3.5px rgba(15, 118, 110, 0.12) !important;
  }

  .reg-input-control.has-toggle {
    padding-right: 44px !important;
  }
  .reg-pwd-toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #94a3b8;
    cursor: pointer;
    font-size: 14px;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
    transition: color 0.15s ease, transform 0.15s ease;
    background: none;
    border: none;
  }
  .reg-pwd-toggle:hover {
    color: #0f766e;
    transform: translateY(-50%) scale(1.1);
  }

  .reg-submit-btn {
    width: 100%;
    height: 46px;
    border-radius: 9px;
    background: linear-gradient(135deg, #0f766e 0%, #0d9488 100%);
    color: #ffffff;
    font-weight: 700;
    font-size: 14.5px;
    border: none;
    box-shadow: 0 4px 14px rgba(15, 118, 110, 0.3);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    margin-top: 6px;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    font-family: inherit;
  }
  .reg-submit-btn:hover {
    transform: translateY(-1.5px);
    box-shadow: 0 6px 20px rgba(15, 118, 110, 0.4);
    background: linear-gradient(135deg, #115e59 0%, #0f766e 100%);
  }
  .reg-submit-btn:active {
    transform: translateY(0);
  }
  .reg-submit-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
  }

  /* Responsive Rules for Small Devices and Narrow Browser Windows */
  @media (max-width: 600px) {
    .reg-modal-overlay {
      padding: 12px 10px;
      align-items: center;
    }
    .reg-modal-card {
      max-height: 94vh;
      border-radius: 16px;
    }
    .reg-modal-header {
      padding: 16px;
    }
    .reg-modal-header h3 {
      font-size: 16.5px;
    }
    .reg-modal-form {
      padding: 16px;
      gap: 13px;
    }
    .reg-grid-row,
    .reg-grid-row-equal {
      grid-template-columns: 1fr !important;
      gap: 12px !important;
    }
  }

  @media (max-height: 700px) {
    .reg-modal-card {
      max-height: 96vh;
    }
    .reg-modal-header {
      padding: 12px 18px;
    }
    .reg-modal-form {
      padding: 14px 18px;
      gap: 12px;
    }
  }
</style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-card glass">
    <div class="login-logo">
      <i class="fa-solid fa-cube"></i>
    </div>
    <h2 id="login-brand-title">PCS Enterprise</h2>
    <p id="login-brand-subtitle">Sign in to access the portal</p>
    
    <div id="error-alert" class="alert alert-danger"></div>
    <div id="success-alert" class="alert alert-success"></div>

    <form id="login-form">
      <div class="form-group" style="margin-bottom: 16px;">
        <label for="company-code-input" style="display:flex; justify-content:space-between; align-items:center;">
          <span>Company Code</span>
          <span style="font-size:11.5px; font-weight:500; color:var(--text-muted);">(Leave blank for PCS)</span>
        </label>
        <div class="input-wrapper">
          <i class="fa-solid fa-hashtag"></i>
          <input type="text" id="company-code-input" class="form-control" placeholder="e.g. pcs or your company code" autocomplete="organization">
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="email" class="form-control" placeholder="name@company.com" required autocomplete="email">
        </div>
      </div>
      
      <div class="form-group" style="margin-bottom: 25px;">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="login-btn">Sign In</button>
    </form>
    
    <a href="#" id="forgot-link" class="forgot-link">Forgot password?</a>

    <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid rgba(255, 255, 255, 0.3); display: flex; align-items: center; justify-content: center; gap: 8px;">
      <span style="font-size: 13.5px; color: var(--text-muted);">New Organization?</span>
      <button type="button" id="btn-open-register-modal" style="background: none; border: none; font-size: 13.5px; font-weight: 800; color: var(--teal-700); cursor: pointer; text-decoration: underline; padding: 0; font-family: inherit;">
        Register as Admin
      </button>
    </div>
  </div>
</div>

<!-- ================= REGISTER NEW COMPANY / ADMIN MODAL ================= -->
<div class="reg-modal-overlay" id="register-company-modal">
  <div class="reg-modal-card">
    
    <!-- Modal Header -->
    <div class="reg-modal-header">
      <div>
        <div class="reg-modal-badge">
          <i class="fa-solid fa-sparkles"></i> Enterprise Setup
        </div>
        <h3>
          <i class="fa-solid fa-building-circle-check" style="color:#0f766e;"></i> Create Company Account
        </h3>
        <p>Register your enterprise organization and setup master Admin access.</p>
      </div>
      <button type="button" id="register-modal-close" class="reg-modal-close-btn" title="Close (Esc)">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- Modal Form -->
    <form id="register-company-form" class="reg-modal-form">
      <div id="reg-error-alert" class="alert alert-danger" style="display:none; margin-bottom:0;"></div>
      <div id="reg-success-alert" class="alert alert-success" style="display:none; margin-bottom:0;"></div>

      <!-- Row 1: Company Name & Code -->
      <div class="reg-grid-row">
        <div class="reg-field-group">
          <label for="reg-company-name">
            <span>Company Name <span class="req">*</span></span>
          </label>
          <div class="reg-input-wrap">
            <i class="fa-solid fa-building reg-input-icon"></i>
            <input type="text" id="reg-company-name" class="reg-input-control" required placeholder="e.g. Tata Consultancy" autocomplete="organization">
          </div>
        </div>

        <div class="reg-field-group">
          <label for="reg-company-code">
            <span>Company Code <span class="req">*</span></span>
            <span class="helper-tag">Slug</span>
          </label>
          <div class="reg-input-wrap">
            <i class="fa-solid fa-hashtag reg-input-icon"></i>
            <input type="text" id="reg-company-code" class="reg-input-control" required placeholder="tata" autocomplete="off" spellcheck="false">
          </div>
        </div>
      </div>

      <!-- Row 2: Admin Full Name -->
      <div class="reg-field-group">
        <label for="reg-admin-name">
          <span>Admin Full Name <span class="req">*</span></span>
        </label>
        <div class="reg-input-wrap">
          <i class="fa-solid fa-user-tie reg-input-icon"></i>
          <input type="text" id="reg-admin-name" class="reg-input-control" required placeholder="e.g. Rajesh Sharma" autocomplete="name">
        </div>
      </div>

      <!-- Row 3: Admin Work Email -->
      <div class="reg-field-group">
        <label for="reg-admin-email">
          <span>Admin Work Email <span class="req">*</span></span>
        </label>
        <div class="reg-input-wrap">
          <i class="fa-regular fa-envelope reg-input-icon"></i>
          <input type="email" id="reg-admin-email" class="reg-input-control" required placeholder="admin@company.com" autocomplete="email">
        </div>
      </div>

      <!-- Row 4: Password & Confirm Password -->
      <div class="reg-grid-row-equal">
        <div class="reg-field-group">
          <label for="reg-password">
            <span>Password <span class="req">*</span></span>
          </label>
          <div class="reg-input-wrap">
            <i class="fa-solid fa-lock reg-input-icon"></i>
            <input type="password" id="reg-password" class="reg-input-control has-toggle" required placeholder="Min 6 characters" autocomplete="new-password">
            <i class="fa-solid fa-eye reg-pwd-toggle" id="toggle-reg-pwd" title="Show/Hide Password"></i>
          </div>
        </div>

        <div class="reg-field-group">
          <label for="reg-confirm-password">
            <span>Confirm Password <span class="req">*</span></span>
          </label>
          <div class="reg-input-wrap">
            <i class="fa-solid fa-shield-halved reg-input-icon"></i>
            <input type="password" id="reg-confirm-password" class="reg-input-control has-toggle" required placeholder="Re-type password" autocomplete="new-password">
            <i class="fa-solid fa-eye reg-pwd-toggle" id="toggle-reg-conf-pwd" title="Show/Hide Password"></i>
          </div>
        </div>
      </div>

      <button type="submit" id="btn-submit-company" class="reg-submit-btn">
        <i class="fa-solid fa-rocket"></i> Register &amp; Launch Dashboard
      </button>
    </form>
  </div>
</div>

<script src="auth.js"></script>
</body>
</html>
